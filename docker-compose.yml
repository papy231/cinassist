# CinAssist — Docker Compose (Redis + PostgreSQL)
# Start: docker-compose up -d

services:
  postgres:
    image: postgres:16-alpine
    container_name: cinassist-db
    environment:
      POSTGRES_USER: cinassist
      POSTGRES_PASSWORD: cinassist
      POSTGRES_DB: cinassist
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cinassist"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: cinassist-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
